[project]
name = "b3-report"
version = "0.1.0"
description = "Load monthly B3 Excel reports into SQLite"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "streamlit>=1.63.0",
    "plotly>=7.0.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
]
